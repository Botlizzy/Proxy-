<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLACK PROXY</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0a0a1a;color:#fff;font-family:system-ui;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px}
    .card{background:rgba(16,16,32,0.92);backdrop-filter:blur(12px);border:1px solid rgba(139,92,246,0.3);border-radius:28px;padding:28px;max-width:480px;width:100%;box-shadow:0 30px 60px rgba(0,0,0,0.7)}
    h1{text-align:center;font-size:26px;font-weight:700;background:linear-gradient(135deg,#a78bfa,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:4px}
    .sub{text-align:center;color:rgba(255,255,255,0.3);font-size:11px;letter-spacing:2px;margin-bottom:20px}
    .badge{display:inline-block;background:rgba(52,211,153,0.15);color:#34d399;font-size:10px;padding:2px 12px;border-radius:20px;border:1px solid rgba(52,211,153,0.2)}
    .section{background:rgba(255,255,255,0.03);border-radius:14px;padding:14px;margin-bottom:16px;border:1px solid rgba(255,255,255,0.04)}
    .section-title{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:rgba(255,255,255,0.25);margin-bottom:10px}
    .toggle-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
    .toggle-row:last-child{border-bottom:none}
    .label{font-size:14px;display:flex;align-items:center;gap:8px}
    .label .tag{font-size:9px;background:rgba(139,92,246,0.15);padding:1px 8px;border-radius:10px;color:#a78bfa;text-transform:uppercase}
    .switch{width:44px;height:24px;background:#3a3a5a;border-radius:12px;cursor:pointer;transition:0.3s;box-shadow:inset 0 2px 4px rgba(0,0,0,0.3);flex-shrink:0}
    .switch.active{background:linear-gradient(135deg,#8b5cf6,#6366f1)}
    .switch .slider{width:18px;height:18px;background:#fff;border-radius:50%;margin:3px;transition:0.3s}
    .switch.active .slider{margin-left:23px}
    .btn{width:100%;padding:12px;border:none;border-radius:14px;background:linear-gradient(135deg,#7c3aed,#6366f1);color:#fff;font-weight:700;font-size:15px;cursor:pointer;transition:0.3s;box-shadow:0 8px 24px rgba(124,58,237,0.3)}
    .btn:hover{filter:brightness(1.1);transform:translateY(-2px)}
    .btn:active{transform:scale(0.97)}
    .status{text-align:center;font-size:13px;margin-top:12px;color:rgba(255,255,255,0.4)}
    .status.success{color:#34d399}
    .status.error{color:#fb7185}
    .ip-display{background:rgba(139,92,246,0.08);padding:8px;border-radius:10px;text-align:center;font-size:12px;color:rgba(255,255,255,0.5);margin-top:10px}
    .key-input{display:flex;gap:10px;margin-bottom:16px}
    .key-input input{flex:1;padding:10px;border-radius:10px;border:1px solid rgba(139,92,246,0.3);background:rgba(255,255,255,0.05);color:#fff;font-size:14px;outline:none}
    .key-input input:focus{border-color:#8b5cf6}
    .key-input button{padding:10px 20px;border:none;border-radius:10px;background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;font-weight:700;cursor:pointer}
    .key-input button:hover{filter:brightness(1.1)}
    .disabled{opacity:0.4;pointer-events:none}
  </style>
</head>
<body>
<div class="card">
  <h1>✦ BLACK PROXY ✦</h1>
  <div class="sub">SECURE ACCESS · KEY-BASED GATEWAY</div>
  <div style="text-align:center;margin-bottom:16px"><span class="badge" id="liveBadge">● OFFLINE</span></div>

  <!-- Key activation area -->
  <div class="key-input">
    <input type="text" id="keyInput" placeholder="Enter your key" />
    <button id="activateBtn">ACTIVATE</button>
  </div>
  <div id="activationStatus" class="status"></div>

  <!-- Toggles (disabled until activated) -->
  <div id="controls" class="disabled">
    <div class="section">
      <div class="section-title">AIM ASSIST</div>
      <div class="toggle-row"><span class="label">Head</span><div class="switch active" id="headSwitch"><div class="slider"></div></div></div>
      <div class="toggle-row"><span class="label">Neck</span><div class="switch" id="neckSwitch"><div class="slider"></div></div></div>
      <div class="toggle-row"><span class="label">Chest</span><div class="switch" id="chestSwitch"><div class="slider"></div></div></div>
      <div class="toggle-row"><span class="label">Rim Assist <span class="tag">bullet mag</span></span><div class="switch" id="rimSwitch"><div class="slider"></div></div></div>
    </div>
    <div class="section">
      <div class="section-title">MOVEMENT</div>
      <div class="toggle-row"><span class="label">Back Jump</span><div class="switch" id="backJumpSwitch"><div class="slider"></div></div></div>
      <div class="toggle-row"><span class="label">Jump Enhance</span><div class="switch" id="jumpEnhanceSwitch"><div class="slider"></div></div></div>
    </div>
    <div class="section">
      <div class="section-title">PROTECTION</div>
      <div class="toggle-row"><span class="label">Bypass</span><div class="switch active" id="bypassSwitch"><div class="slider"></div></div></div>
      <div class="toggle-row"><span class="label">Protection</span><div class="switch active" id="protectionSwitch"><div class="slider"></div></div></div>
    </div>
    <button class="btn" id="saveBtn">⚡ APPLY SETTINGS</button>
  </div>

  <div id="ipDisplay" class="ip-display">IP: not registered</div>
</div>

<script>
// Elements
const keyInput = document.getElementById('keyInput');
const activateBtn = document.getElementById('activateBtn');
const activationStatus = document.getElementById('activationStatus');
const controls = document.getElementById('controls');
const liveBadge = document.getElementById('liveBadge');
const ipDisplay = document.getElementById('ipDisplay');

const head = document.getElementById('headSwitch');
const neck = document.getElementById('neckSwitch');
const chest = document.getElementById('chestSwitch');
const rim = document.getElementById('rimSwitch');
const backJump = document.getElementById('backJumpSwitch');
const jumpEnhance = document.getElementById('jumpEnhanceSwitch');
const bypass = document.getElementById('bypassSwitch');
const protection = document.getElementById('protectionSwitch');
const statusDiv = document.getElementById('status');

let activated = false;

// Activation function
async function activateKey(key) {
  try {
    const res = await fetch('/activate', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ key })
    });
    const data = await res.json();
    if (data.success) {
      activationStatus.textContent = '✅ Key activated!';
      activationStatus.className = 'status success';
      liveBadge.textContent = '● LIVE';
      liveBadge.style.color = '#34d399';
      controls.classList.remove('disabled');
      activated = true;
      // Load settings after activation
      loadSettings();
      fetchIP();
      return true;
    } else {
      activationStatus.textContent = '❌ ' + (data.error || 'Invalid key');
      activationStatus.className = 'status error';
      return false;
    }
  } catch {
    activationStatus.textContent = '❌ Network error';
    activationStatus.className = 'status error';
    return false;
  }
}

// Load settings (only if activated)
async function loadSettings() {
  if (!activated) return;
  try {
    const res = await fetch('/');
    const data = await res.json();
    if (data.aimbot) {
      head.classList.toggle('active', data.aimbot.head === true);
      neck.classList.toggle('active', data.aimbot.neck === true);
      chest.classList.toggle('active', data.aimbot.chest === true);
      rim.classList.toggle('active', data.aimbot.rim_assist === true);
      backJump.classList.toggle('active', data.aimbot.back_jump === true);
      jumpEnhance.classList.toggle('active', data.aimbot.jump_enhance === true);
      bypass.classList.toggle('active', data.aimbot.bypass === true);
      protection.classList.toggle('active', data.aimbot.protection === true);
      statusDiv.textContent = '✅ Configuration loaded';
      statusDiv.className = 'status success';
    }
  } catch {
    statusDiv.textContent = '❌ Failed to load settings';
    statusDiv.className = 'status error';
  }
}

// Fetch IP
async function fetchIP() {
  try {
    const res = await fetch('/register');
    // Extract IP from response? Simpler: we can use a separate endpoint.
    // For simplicity, we'll just display a generic message.
    ipDisplay.textContent = 'Your IP: registered with key';
  } catch {
    ipDisplay.textContent = 'IP: unknown';
  }
}

// Activate button
activateBtn.addEventListener('click', async () => {
  const key = keyInput.value.trim();
  if (!key) {
    activationStatus.textContent = 'Please enter a key';
    activationStatus.className = 'status error';
    return;
  }
  await activateKey(key);
});

// Save settings (only if activated)
document.getElementById('saveBtn').addEventListener('click', async () => {
  if (!activated) {
    statusDiv.textContent = '⚠️ Activate a key first';
    statusDiv.className = 'status error';
    return;
  }
  const payload = {
    aimbot: {
      head: head.classList.contains('active'),
      neck: neck.classList.contains('active'),
      chest: chest.classList.contains('active'),
      rim_assist: rim.classList.contains('active'),
      back_jump: backJump.classList.contains('active'),
      jump_enhance: jumpEnhance.classList.contains('active'),
      bypass: bypass.classList.contains('active'),
      protection: protection.classList.contains('active')
    }
  };
  try {
    const res = await fetch('/settings', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (data.success) {
      statusDiv.textContent = '✅ Settings applied successfully!';
      statusDiv.className = 'status success';
    } else {
      statusDiv.textContent = '❌ ' + (data.error || 'Error');
      statusDiv.className = 'status error';
    }
  } catch {
    statusDiv.textContent = '❌ Network error';
    statusDiv.className = 'status error';
  }
});

// Toggle switches on click
document.querySelectorAll('.switch').forEach(sw => {
  sw.addEventListener('click', function() {
    if (!activated) return;
    this.classList.toggle('active');
  });
});

// Try to auto-load if already activated (e.g., IP already whitelisted)
// We'll attempt to load settings; if 403, it means not activated.
(async function() {
  try {
    const res = await fetch('/');
    if (res.status === 403) {
      activationStatus.textContent = '⚠️ Please activate with a key.';
      activationStatus.className = 'status error';
      controls.classList.add('disabled');
      return;
    }
    const data = await res.json();
    // If we got data, we are already activated (IP is whitelisted)
    activated = true;
    liveBadge.textContent = '● LIVE';
    liveBadge.style.color = '#34d399';
    controls.classList.remove('disabled');
    activationStatus.textContent = '✅ Already activated';
    activationStatus.className = 'status success';
    loadSettings();
    fetchIP();
  } catch {
    // Network error
  }
})();
</script>
</body>
</html>
