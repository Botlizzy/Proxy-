<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BLACK CORPS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#fff;font-family:'Segoe UI',system-ui;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px;background-image:radial-gradient(circle at 20% 20%,rgba(139,92,246,0.05),transparent 60%)}
.card{background:rgba(12,12,28,0.92);backdrop-filter:blur(16px);border:1px solid rgba(139,92,246,0.25);border-radius:32px;padding:28px 24px;max-width:480px;width:100%;box-shadow:0 40px 80px rgba(0,0,0,0.7)}
h1{text-align:center;font-size:26px;font-weight:700;background:linear-gradient(135deg,#c4b5fd,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:2px}
.sub{text-align:center;color:rgba(255,255,255,0.25);font-size:10px;letter-spacing:4px;text-transform:uppercase;margin-top:4px;margin-bottom:12px}
.live-badge{display:inline-block;background:rgba(52,211,153,0.12);color:#34d399;font-size:11px;padding:4px 16px;border-radius:20px;border:1px solid rgba(52,211,153,0.2);margin-bottom:16px;text-align:center}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.row:last-child{border-bottom:none}
.label{font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px}
.label .tag{font-size:8px;background:rgba(139,92,246,0.15);padding:1px 8px;border-radius:10px;color:#a78bfa;text-transform:uppercase;letter-spacing:0.5px}
.switch{width:44px;height:24px;background:#3a3a5a;border-radius:12px;cursor:pointer;transition:0.3s;flex-shrink:0;box-shadow:inset 0 2px 4px rgba(0,0,0,0.3)}
.switch.active{background:linear-gradient(135deg,#8b5cf6,#6366f1)}
.switch .slider{width:18px;height:18px;background:#fff;border-radius:50%;margin:3px;transition:0.3s}
.switch.active .slider{margin-left:23px}
.section{background:rgba(255,255,255,0.02);border-radius:14px;padding:12px 16px;margin-bottom:14px;border:1px solid rgba(255,255,255,0.04)}
.section-title{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:rgba(255,255,255,0.2);margin-bottom:8px}
.key-area{display:flex;gap:10px;margin-bottom:14px}
.key-area input{flex:1;padding:12px;border-radius:12px;border:1px solid rgba(139,92,246,0.3);background:rgba(255,255,255,0.03);color:#fff;font-size:14px;outline:none}
.key-area input:focus{border-color:#8b5cf6}
.key-area button{padding:12px 20px;border:none;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#6366f1);color:#fff;font-weight:700;font-size:14px;cursor:pointer;transition:0.3s}
.key-area button:hover{filter:brightness(1.1)}
.btn{width:100%;padding:14px;border:none;border-radius:14px;background:linear-gradient(135deg,#7c3aed,#6366f1);color:#fff;font-weight:700;font-size:15px;cursor:pointer;transition:0.3s;box-shadow:0 8px 24px rgba(124,58,237,0.3)}
.btn:hover{filter:brightness(1.1);transform:translateY(-2px)}
.status{text-align:center;font-size:13px;margin:10px 0;color:rgba(255,255,255,0.4)}
.status.success{color:#34d399}
.status.error{color:#fb7185}
.ip-line{background:rgba(139,92,246,0.06);padding:8px;border-radius:10px;text-align:center;font-size:12px;color:rgba(255,255,255,0.4);margin-top:10px;font-family:monospace}
.ip-line strong{color:#a78bfa}
.disabled{opacity:0.35;pointer-events:none}
</style>
</head>
<body>
<div class="card">
  <h1>✦ BLACK CORPS ✦</h1>
  <div class="sub">BLACK 444 X · PROXY</div>
  <div style="text-align:center;margin-bottom:8px"><span class="live-badge" id="liveBadge">● OFFLINE</span></div>

  <!-- KEY AREA -->
  <div class="key-area">
    <input type="text" id="keyInput" placeholder="Enter your key" />
    <button id="activateBtn">ACTIVATE</button>
  </div>
  <div id="activationStatus" class="status">Enter a key to activate</div>

  <!-- CONTROLS (disabled until activated) -->
  <div id="controls" class="disabled">
    <!-- AIM ASSIST -->
    <div class="section">
      <div class="section-title">AIM ASSIST</div>
      <div class="row"><span class="label">RIM ASSIST</span><div class="switch" id="rimSwitch"><div class="slider"></div></div></div>
      <div class="row"><span class="label">HS NECK <span class="tag">head</span></span><div class="switch" id="neckSwitch"><div class="slider"></div></div></div>
      <div class="row"><span class="label">WEARSHOULDER <span class="tag">neck</span></span><div class="switch" id="wearShoulderSwitch"><div class="slider"></div></div></div>
      <div class="row"><span class="label">HS CHEST <span class="tag">head</span></span><div class="switch" id="chestSwitch"><div class="slider"></div></div></div>
      <div class="row"><span class="label">WEARSHOULDER <span class="tag">chest</span></span><div class="switch" id="wearShoulderChestSwitch"><div class="slider"></div></div></div>
    </div>

    <!-- PROTECTION -->
    <div class="section">
      <div class="section-title">PROTECTION</div>
      <div class="row"><span class="label">BYPASS</span><div class="switch active" id="bypassSwitch"><div class="slider"></div></div></div>
      <div class="row"><span class="label">BYPASS ENTIRE</span><div class="switch active" id="bypassEntireSwitch"><div class="slider"></div></div></div>
    </div>

    <!-- CONFIGURATION -->
    <div class="section">
      <div class="section-title">CONFIGURATION</div>
      <div class="row"><span class="label">PLAY</span><div class="switch active" id="playSwitch"><div class="slider"></div></div></div>
      <div class="row"><span class="label">BACKJUMP</span><div class="switch" id="backJumpSwitch"><div class="slider"></div></div></div>
      <div class="row"><span class="label">JUMP ENHANCE</span><div class="switch" id="jumpEnhanceSwitch"><div class="slider"></div></div></div>
    </div>

    <button class="btn" id="saveBtn">⚡ APPLY CONFIG</button>
  </div>

  <div id="ipDisplay" class="ip-line">IP: <strong>not registered</strong></div>
</div>

<script>
const keyInput = document.getElementById('keyInput');
const activateBtn = document.getElementById('activateBtn');
const activationStatus = document.getElementById('activationStatus');
const controls = document.getElementById('controls');
const liveBadge = document.getElementById('liveBadge');
const ipDisplay = document.getElementById('ipDisplay');

// All switches
const rim = document.getElementById('rimSwitch');
const neck = document.getElementById('neckSwitch');
const wearShoulder = document.getElementById('wearShoulderSwitch');
const chest = document.getElementById('chestSwitch');
const wearShoulderChest = document.getElementById('wearShoulderChestSwitch');
const bypass = document.getElementById('bypassSwitch');
const bypassEntire = document.getElementById('bypassEntireSwitch');
const play = document.getElementById('playSwitch');
const backJump = document.getElementById('backJumpSwitch');
const jumpEnhance = document.getElementById('jumpEnhanceSwitch');

let activated = false;

// ---- Activation ----
activateBtn.addEventListener('click', async () => {
  const key = keyInput.value.trim();
  if (!key) {
    activationStatus.textContent = 'Please enter a key';
    activationStatus.className = 'status error';
    return;
  }
  try {
    const res = await fetch('/activate', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ key })
    });
    const data = await res.json();
    if (data.success) {
      activationStatus.textContent = '✅ Key activated!';
      activationStatus.className = 'status success';
      liveBadge.textContent = '● LIVE';
      liveBadge.style.color = '#34d399';
      controls.classList.remove('disabled');
      activated = true;
      loadSettings();
      fetchIP();
    } else {
      activationStatus.textContent = '❌ ' + (data.error || 'Invalid key');
      activationStatus.className = 'status error';
    }
  } catch {
    activationStatus.textContent = '❌ Network error';
    activationStatus.className = 'status error';
  }
});

// ---- Load settings ----
async function loadSettings() {
  if (!activated) return;
  try {
    const res = await fetch('/config');
    if (res.status === 403) {
      controls.classList.add('disabled');
      return;
    }
    const data = await res.json();
    if (data.aimbot) {
      rim.classList.toggle('active', data.aimbot.rim_assist === true);
      neck.classList.toggle('active', data.aimbot.neck === true);
      chest.classList.toggle('active', data.aimbot.chest === true);
      wearShoulder.classList.toggle('active', data.aimbot.wear_shoulder === true);
      wearShoulderChest.classList.toggle('active', data.aimbot.wear_shoulder_chest === true);
      bypass.classList.toggle('active', data.aimbot.bypass === true);
      bypassEntire.classList.toggle('active', data.aimbot.bypass_entire === true);
      play.classList.toggle('active', data.aimbot.play === true);
      backJump.classList.toggle('active', data.aimbot.back_jump === true);
      jumpEnhance.classList.toggle('active', data.aimbot.jump_enhance === true);
    }
  } catch (e) {}
}

// ---- Fetch IP ----
async function fetchIP() {
  try {
    const res = await fetch('/ip');
    const data = await res.json();
    ipDisplay.innerHTML = `IP: <strong>${data.ip}</strong>`;
  } catch {}
}

// ---- Save settings ----
document.getElementById('saveBtn').addEventListener('click', async () => {
  if (!activated) {
    activationStatus.textContent = '⚠️ Activate a key first';
    activationStatus.className = 'status error';
    return;
  }
  const payload = {
    aimbot: {
      rim_assist: rim.classList.contains('active'),
      neck: neck.classList.contains('active'),
      chest: chest.classList.contains('active'),
      wear_shoulder: wearShoulder.classList.contains('active'),
      wear_shoulder_chest: wearShoulderChest.classList.contains('active'),
      bypass: bypass.classList.contains('active'),
      bypass_entire: bypassEntire.classList.contains('active'),
      play: play.classList.contains('active'),
      back_jump: backJump.classList.contains('active'),
      jump_enhance: jumpEnhance.classList.contains('active')
    }
  };
  try {
    const res = await fetch('/settings', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (data.success) {
      activationStatus.textContent = '✅ Config applied!';
      activationStatus.className = 'status success';
    } else {
      activationStatus.textContent = '❌ ' + (data.error || 'Error');
      activationStatus.className = 'status error';
    }
  } catch {
    activationStatus.textContent = '❌ Network error';
    activationStatus.className = 'status error';
  }
});

// ---- Toggle clicks ----
document.querySelectorAll('.switch').forEach(s => {
  s.addEventListener('click', function() {
    if (!activated) return;
    this.classList.toggle('active');
  });
});

// ---- Auto-check if already authorized ----
(async function init() {
  try {
    const res = await fetch('/config');
    if (res.status === 403) {
      controls.classList.add('disabled');
      activationStatus.textContent = '⚠️ Activate with a key';
      activationStatus.className = 'status error';
      return;
    }
    // If we get here, we're already authorized
    activated = true;
    liveBadge.textContent = '● LIVE';
    liveBadge.style.color = '#34d399';
    controls.classList.remove('disabled');
    activationStatus.textContent = '✅ Already activated';
    activationStatus.className = 'status success';
    loadSettings();
    fetchIP();
  } catch {}
})();
</script>
</body>
</html>
