<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Media Downloader</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text: #f8fafc;
            --muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card);
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 540px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            text-align: center;
        }

        p.subtitle {
            color: var(--muted);
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 24px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            outline: none;
            font-size: 0.95rem;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        button {
            padding: 12px 20px;
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .options {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: var(--muted);
        }

        .options label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        #preview {
            display: none;
            border-top: 1px solid #334155;
            padding-top: 20px;
            margin-top: 10px;
        }

        #thumbnail {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        #video-title {
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 16px;
        }

        #status {
            text-align: center;
            font-size: 0.9rem;
            margin-top: 14px;
            color: var(--muted);
        }

        .error {
            color: #f87171 !important;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Media Downloader</h1>
    <p class="subtitle">Paste a public link from supported platforms</p>

    <div class="input-group">
        <input type="text" id="url" placeholder="https://..." autocomplete="off">
        <button id="fetch-btn" onclick="fetchInfo()">Fetch</button>
    </div>

    <div class="options">
        <label>
            <input type="radio" name="format" value="mp4" checked> Video (MP4)
        </label>
        <label>
            <input type="radio" name="format" value="mp3"> Audio only (MP3)
        </label>
    </div>

    <div id="preview">
        <img id="thumbnail" src="" alt="Thumbnail">
        <div id="video-title"></div>
        <button id="download-btn" style="width: 100%;" onclick="startDownload()">Download</button>
    </div>

    <div id="status"></div>
</div>

<script>
    async function fetchInfo() {
        const url = document.getElementById("url").value.trim();
        const status = document.getElementById("status");
        const fetchBtn = document.getElementById("fetch-btn");
        const preview = document.getElementById("preview");

        if (!url) return;

        status.className = "";
        status.innerText = "Fetching video details...";
        fetchBtn.disabled = true;
        preview.style.display = "none";

        try {
            const res = await fetch("/api/info", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ url })
            });

            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "Failed to fetch info");

            document.getElementById("thumbnail").src = data.thumbnail || "";
            document.getElementById("video-title").innerText = data.title;
            preview.style.display = "block";
            status.innerText = "";
        } catch (err) {
            status.className = "error";
            status.innerText = err.message;
        } finally {
            fetchBtn.disabled = false;
        }
    }

    async function startDownload() {
        const url = document.getElementById("url").value.trim();
        const format = document.querySelector('input[name="format"]:checked').value;
        const status = document.getElementById("status");
        const dlBtn = document.getElementById("download-btn");

        status.className = "";
        status.innerText = "Downloading & processing on server, please wait...";
        dlBtn.disabled = true;

        try {
            const response = await fetch("/api/download", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ url, format })
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error || "Download failed");
            }

            // Extract filename from header if available
            const disposition = response.headers.get("Content-Disposition");
            let filename = `download.${format}`;
            if (disposition && disposition.indexOf("filename=") !== -1) {
                const matches = /filename="?([^"]+)"?/.exec(disposition);
                if (matches != null && matches[1]) filename = matches[1];
            }

            // Trigger browser download via Blob
            const blob = await response.blob();
            const downloadUrl = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = downloadUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.URL.revokeObjectURL(downloadUrl);

            status.innerText = "Download complete!";
        } catch (err) {
            status.className = "error";
            status.innerText = err.message;
        } finally {
            dlBtn.disabled = false;
        }
    }
</script>

</body>
</html>
